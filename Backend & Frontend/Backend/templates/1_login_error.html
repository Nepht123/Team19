<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configures character encoding and responsive scaling for mobile screens -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Error - Rate My Module</title>
    
    <!-- Bootstrap 5 layout stylesheet framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icon styles -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Link connects directly to your stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='1_index.css') }}">
</head>

<!-- Body wrapper applies your custom SVG background pattern and forces a full screen viewport layout stack -->
<body class="custom-pattern-bg d-flex flex-column vh-100">

    <!-- Top header navigation brand section -->
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm py-3 w-100">
        <div class="container justify-content-center justify-content-md-start">
            <a class="navbar-brand fw-bold text-navy" href="{{ url_for('index') }}">
                <img src="/static/UWC_LOGO.png" alt="UWC Logo" height="40" class="me-2">
                Rate My Module
            </a>
        </div>
    </nav>

    <!-- Main screen section stretches to center the card vertically and horizontally -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                    
                    <!-- Central authentication error presentation card matching your login card border structure -->
                    <div class="card border-0 shadow-lg p-4 login-card rounded-3 bg-white text-center">
                        
                        <!-- Error Icon Badge -->
                        <div class="my-3">
                            <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                                <i class="fa-solid fa-triangle-exclamation fs-1"></i>
                            </div>
                        </div>







                        
                        
                        <!-- Static Error Header & Description -->
                        <h2 class="fw-bold text-navy mb-2">{{ title or "Authentication Error" }}</h2>
                        <p class="text-muted small mb-4 px-2">
                            {{error}}
                        </p>







                        
                        <!-- Primary Action: Obvious Return Button -->
                        <div class="d-grid mb-3">
                            <a href="{{ url_for('log_in') }}" class="btn btn-navy text-white py-3 fw-bold rounded-pill shadow-sm">
                                <i class="fa-solid fa-arrow-left me-2"></i> Return to Login
                            </a>
                        </div>

                        <!-- Secondary Home Action -->
                        <div class="text-center mt-2">
                            <a href="{{ url_for('index') }}" class="text-navy text-decoration-none small fw-bold d-inline-block">
                                <i class="fa-solid fa-house me-1"></i> Back to Homepage
                            </a>
                        </div>

                    </div> 
                </div> 
            </div> 
        </div>
    </main>

    <!-- Base floor screen layout flat minimalist platform footer block -->
    <footer class="text-center py-3 bg-white border-top w-100 mt-auto">
        <p class="small text-muted mb-0">&copy; 2026 University of the Western Cape. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap 5 JavaScript compiled interaction dependency files bundle package link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
