<!doctype html> 
<html lang="en"> 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Programmes - Rate My Module</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Custom colors to match the Rate My Module theme */
        .text-navy { color: #00205b; }
        .bg-navy { background-color: #00205b; }
        
        /* Smooth animation for hovering over programme cards */
        .programme-card {
            transition: all 0.2s ease-in-out;
            border-left: 5px solid transparent;
        }
        
        /* Adds a gold accent line and light background when a card is hovered */
        .programme-card:hover {
            border-left: 5px solid #ffc107; 
            background-color: #f8f9fa;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-navy" href="home.html">
                <img src="UWC_LOGO.png" alt="UWC Logo" height="45" class="me-2">                  
                Rate My Module
            </a>
            
            <div class="ms-auto">
                <a href="home.html" class="btn btn-outline-secondary rounded-pill fw-bold">
                    <i class="fa-solid fa-house me-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <header class="bg-navy text-white py-4 shadow-sm">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-md-6 mb-3 mb-md-0">
                    <h2 class="fw-bold mb-0" id="facultyTitle">Loading Faculty...</h2>
                    <p class="text-light mb-0" id="facultySubtitle">Find your programme to see modules.</p>
                </div>
                
                <div class="col-md-6">
                    <div class="input-group input-group-lg bg-white rounded-pill p-1 shadow-sm">
                        <span class="input-group-text border-0 bg-transparent text-muted">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-0 bg-transparent shadow-none" placeholder="Search programmes (e.g. Computer Science)...">
                    </div>
                </div>
                
            </div>
        </div>
    </header>

    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-secondary mb-0">Available Programmes</h4>
                    <span class="badge bg-secondary rounded-pill px-3 py-2" id="resultCount">0 Results</span>
                </div>

                <div id="programmesList" class="d-flex flex-column gap-3"></div>
                
                <div id="noResultsMsg" class="text-center py-5 d-none">
                    <i class="fa-regular fa-face-frown-open fs-1 text-muted mb-3"></i>
                    <h5 class="text-muted">No programmes match your search.</h5>
                </div>
                
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Database of dummy programmes for the prototype
            const facultyData = {
                arts: {
                    title: "Arts and Humanities",
                    programmes: ["BA General", "BA Linguistics", "BA History", "BA Psychology", "Bachelor of Theology"]
                },
                chs: {
                    title: "Community & Health Sciences",
                    programmes: ["BSc Physiotherapy", "BSc Nursing", "BSc Occupational Therapy", "BSc Dietetics", "Bachelor of Social Work"]
                },
                dentistry: {
                    title: "Dentistry",
                    programmes: ["BChD (Dentistry)", "Bachelor of Oral Health"]
                },
                ems: {
                    title: "Economic & Management Sciences",
                    programmes: ["BCom General", "BCom Accounting", "BCom Information Systems", "BCom Finance", "BAdmin"]
                },
                education: {
                    title: "Education",
                    programmes: ["BEd Foundation Phase", "BEd Senior Phase", "Postgraduate Certificate in Education (PGCE)"]
                },
                law: {
                    title: "Law",
                    programmes: ["LLB (Bachelor of Laws)", "BA Law", "BCom Law"]
                },
                science: {
                    title: "Natural Sciences",
                    programmes: ["BSc Computer Science", "BSc Mathematics", "BSc Physics", "BSc Biotechnology", "BSc Environmental Water Science"]
                }
            };

            // 2. Get the faculty parameter from the URL (e.g., ?faculty=science)
            const urlParams = new URLSearchParams(window.location.search);
            const selectedFacultyKey = urlParams.get('faculty');

            // Find elements on the page we need to interact with
            const titleElement = document.getElementById('facultyTitle');
            const listContainer = document.getElementById('programmesList');
            const searchInput = document.getElementById('searchInput');
            const resultCount = document.getElementById('resultCount');
            const noResultsMsg = document.getElementById('noResultsMsg');

            let currentProgrammes = [];

            // 3. Check if faculty exists in our dummy database and load it
            if (selectedFacultyKey && facultyData[selectedFacultyKey]) {
                const faculty = facultyData[selectedFacultyKey];
                titleElement.textContent = faculty.title;
                currentProgrammes = faculty.programmes;
                renderProgrammes(currentProgrammes);
            } else {
                // Fallback if someone opens the page without clicking a link
                titleElement.textContent = "All Faculties";
                document.getElementById('facultySubtitle').textContent = "Please return home and select a specific faculty.";
            }

            // 4. Function to draw the cards on the screen
            function renderProgrammes(programmesToRender) {
                listContainer.innerHTML = ''; // Clear current list
                
                // Show the 'no results' message if the array is empty
                if (programmesToRender.length === 0) {
                    noResultsMsg.classList.remove('d-none');
                } else {
                    noResultsMsg.classList.add('d-none');
                    
                    // Loop through each programme and create a card for it
                    programmesToRender.forEach(prog => {
                        // ADJUSTED: Changed href to redirect to by_program_modules.html with the program parameter passed in safely
                        const cardHTML = `
                            <div class="card shadow-sm border-0 programme-card">
                                <div class="card-body p-4 d-flex justify-content-between align-items-center">
                                    <div>
                                        <h5 class="fw-bold text-dark mb-1 programme-name">${prog}</h5>
                                        <small class="text-muted"><i class="fa-solid fa-graduation-cap me-1"></i> Undergraduate Degree</small>
                                    </div>
                                    <a href="by_program_modules.html?program=${encodeURIComponent(prog)}" class="btn btn-outline-primary rounded-pill px-4">View Modules</a>
                                </div>
                            </div>
                        `;
                        listContainer.innerHTML += cardHTML;
                    });
                }
                
                // Update the counter text
                resultCount.textContent = `${programmesToRender.length} Results`;
            }

            // 5. The Real-Time Search Filter Logic
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                
                // Filter the array based on what the user types
                const filteredProgrammes = currentProgrammes.filter(prog => 
                    prog.toLowerCase().includes(searchTerm)
                );
                
                // Re-draw the screen with only the filtered items
                renderProgrammes(filteredProgrammes);
            });
        });
    </script>
</body>
</html>
