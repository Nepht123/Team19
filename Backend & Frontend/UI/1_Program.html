<!doctype html> 
<html lang="en"> 

    <head>
        <!-- Sets the character encoding to UTF-8 so special characters display correctly -->
        <meta charset="utf-8">
        <!-- Makes the page responsive: sets viewport width to device width and disables auto-zoom scaling -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!-- Sets the text shown in the browser tab / title bar -->
        <title>Programmes - Rate My Module</title>
        
        <!-- Loads the Bootstrap 5.3.3 CSS framework from a CDN for layout/components -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Loads Font Awesome 6.4.0 icon library from a CDN for the icons used on this page -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        
        <!-- Add your stylesheet link here (adjust filename if different) -->
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <!-- Start of an inline <style> block defining custom CSS rules for this page -->
        <style>
            /* Comment explaining the purpose of the custom colour classes below (original CSS comment) */
            /* Custom colors to match the Rate My Module theme */
            /*Custom utility class that sets text color to a navy blue hex value */
            .text-navy { color: #00205b; }
            /* Custom utility class that sets background color to the same navy blue hex value */
            .bg-navy { background-color: #00205b; }
            
            /* Comment explaining the purpose of the hover transition rule below (original CSS comment) */
            /* Smooth animation for hovering over programme cards */
            /* Base style for programme cards: smooth transition for all properties and a transparent left border reserved for the hover effect */
            .programme-card {
                transition: all 0.2s ease-in-out;
                border-left: 5px solid transparent;
            }
            
            /* Comment explaining what happens on hover (original CSS comment) */
            /* Adds a gold accent line and light background when a card is hovered */
            /*-- Hover state for programme cards: shows a gold left border and a light gray background */
            .programme-card:hover {
                border-left: 5px solid #ffc107; 
                background-color: #f8f9fa;
            }
        /* End of the inline style block */
        </style>
    <!-- End of the head section -->
    </head>

<body>
        
    <!-- Navigation bar: Bootstrap navbar, expands on large screens, light theme, white background, sticky to top, with shadow and vertical padding -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <!-- Bootstrap container to center and constrain the navbar's width -->
        <div class="container">
            <!-- Brand/logo link in the navbar, bold navy text, links back to the home page -->
            <a class="navbar-brand fw-bold text-navy" href="1_index.html">
                <!-- UWC logo image served from the static folder, 45px tall, with right margin spacing -->
                <img src="/static/UWC_LOGO.png" alt="UWC Logo" height="45" class="me-2">                  
                Rate My Module
            <!-- End of the brand link -->
            </a>
            
            <!-- Container pushed to the right (ms-auto) holding the Home button -->
            <div class="ms-auto">
                <!-- Home button link; href uses a Flask/Jinja template expression to generate the URL for the 'index' route -->
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rounded-pill fw-bold">
                    <!-- Font Awesome house icon with right margin spacing before the "Home" text -->
                    <i class="fa-solid fa-house me-1"></i> Home
                <!-- End of the Home button link -->
                </a>
            <!-- End of the right-aligned container -->
            </div>
        <!-- End of the navbar's inner container -->
        </div>
    <!-- End of the navbar -->
    </nav>

    <!-- Hero header section: navy background, white text, vertical padding, drop shadow -->
    <header class="bg-navy text-white py-4 shadow-sm">
        <!-- Bootstrap container to center and constrain the header's width -->
        <div class="container">
            <!-- Bootstrap row with vertically centered columns -->
            <div class="row align-items-center">
                
                <!-- Left column (half width on medium+ screens) holding the faculty title/subtitle, with bottom margin removed on medium+ -->
                <div class="col-md-6 mb-3 mb-md-0">
                    <!-- Faculty name heading, initially showing a loading placeholder; updated dynamically by JavaScript -->
                    <h2 class="fw-bold mb-0" id="facultyTitle">Loading Faculty...</h2>
                    <!-- Subtitle paragraph giving instructions; also updatable by JavaScript -->
                    <p class="text-light mb-0" id="facultySubtitle">Find your programme to see modules.</p>
                <!-- End of the title/subtitle column -->
                </div>
                
                <!-- Right column (half width on medium+ screens) holding the search input -->
                <div class="col-md-6">
                    <!-- Input group styled as a large, rounded, white, shadowed search bar -->
                    <div class="input-group input-group-lg bg-white rounded-pill p-1 shadow-sm">
                        <!-- Decorative span containing the search icon, borderless and transparent background -->
                        <span class="input-group-text border-0 bg-transparent text-muted">
                            <!-- Font Awesome magnifying glass icon representing search -->
                            <i class="fa-solid fa-magnifying-glass"></i>
                        <!-- End of the icon span -->
                        </span>
                        <!-- Text input field where the user types to filter programmes; borderless and transparent background, no focus shadow -->
                        <input type="text" id="searchInput" class="form-control border-0 bg-transparent shadow-none" placeholder="Search programmes (e.g. Computer Science)...">
                    <!-- End of the search input group -->
                    </div>
                <!-- End of the search column -->
                </div>
                
            <!-- End of the header row -->
            </div>
        <!-- End of the header container -->
        </div>
    <!-- End of the hero header section -->
    </header>

    <!-- Main content section listing available programmes, with vertical margin -->
    <section class="container my-5">
        <!-- Row used to horizontally center the content column -->
        <div class="row justify-content-center">
            <!-- Column sized to 9/12 width on large screens, containing the programme list -->
            <div class="col-lg-9">
                
                <!-- Flex container spacing the "Available Programmes" heading and result count badge apart, with bottom margin -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <!-- Section heading labeling the list of programmes -->
                    <h4 class="fw-bold text-secondary mb-0">Available Programmes</h4>
                    <!-- Badge showing how many results are currently displayed; text updated dynamically by JavaScript -->
                    <span class="badge bg-secondary rounded-pill px-3 py-2" id="resultCount">0 Results</span>
                <!-- End of the heading/count row -->
                </div>












                <!-- Empty container that JavaScript will fill with programme cards; flex column layout with gap spacing between cards -->
                <div id="programmesList" class="d-flex flex-column gap-3"></div>
                







                <!-- Message shown when no programmes match the search; hidden by default via the d-none class -->
                <div id="noResultsMsg" class="text-center py-5 d-none">
                    <!-- Font Awesome frowning face icon shown above the "no results" text, with bottom margin -->
                    <i class="fa-regular fa-face-frown-open fs-1 text-muted mb-3"></i>
                    <!-- Muted text informing the user that no programmes matched their search -->
                    <h5 class="text-muted">No programmes match your search.</h5>
                <!-- End of the no-results message container -->
                </div>
                
            <!-- End of the content column -->
            </div>
        <!-- End of the centering row -->
        </div>
    <!-- End of the programmes list section -->
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            



            // Dynamic Database to replace the dummy programmes
           
            const facultyData = {
                "{{ faculty }}": {
                    title: "{{ faculty }}",
                    programmes: JSON.parse('{{ programmes | tojson | safe }}')
                }
            };
                   


            // 2. Get the faculty parameter from the URL (e.g., ?faculty=science)
            const urlParams = new URLSearchParams(window.location.search);
            const selectedFacultyKey = urlParams.get('faculty');

            // Find elements on the page we need to interact with
            const titleElement = document.getElementById('facultyTitle');
            const listContainer = document.getElementById('programmesList');
            const searchInput = document.getElementById('searchInput');
            const resultCount = document.getElementById('resultCount');
            const noResultsMsg = document.getElementById('noResultsMsg');

            let currentProgrammes = [];

            // 3. Check if faculty exists in our database and load it
            if (selectedFacultyKey && facultyData[selectedFacultyKey]) {
                const faculty = facultyData[selectedFacultyKey];
                titleElement.textContent = faculty.title;
                currentProgrammes = faculty.programmes;
                renderProgrammes(currentProgrammes);
            } else {
                // Fallback if someone opens the page without clicking a link
                titleElement.textContent = "All Faculties";
                document.getElementById('facultySubtitle').textContent = "Please return home and select a specific faculty.";
            }

            // 4. Function to draw the cards on the screen
            function renderProgrammes(programmesToRender) {
                listContainer.innerHTML = ''; // Clear current list
                
                // Show the 'no results' message if the array is empty
                if (programmesToRender.length === 0) {
                    noResultsMsg.classList.remove('d-none');
                } else {
                    noResultsMsg.classList.add('d-none');
                    



                    // 1. Define a base URL using url_for with a placeholder string at the top
                    // NOTE: Replace 'by_program_modules' with the exact name of your Python function in app.py!
                    const modulesBaseUrl = "{{ url_for('Program_modules', Programme='PLACEHOLDER') }}";


                    // Loop through each programme and create a card for it
                    programmesToRender.forEach(prog => {

                        // 2. Use JS to swap 'PLACEHOLDER' with your dynamic browser variable
                        const finalUrl = modulesBaseUrl.replace('PLACEHOLDER', encodeURIComponent(prog));

                        const cardHTML = `
                            <div class="card shadow-sm border-0 programme-card">
                                <div class="card-body p-4 d-flex justify-content-between align-items-center">
                                    <div>
                                        <h5 class="fw-bold text-dark mb-1 programme-name">${prog}</h5>
                                        <small class="text-muted"><i class="fa-solid fa-graduation-cap me-1"></i></small>
                                    </div>
                                    <a href="${finalUrl}" class="btn btn-navy rounded-pill px-4 text-nowrap">View Modules</a>                            </div>
                        `;
                        listContainer.innerHTML += cardHTML;
                    });
                }
                
                // Update the counter text
                resultCount.textContent = `${programmesToRender.length} Results`;
            }

            // 5. The Real-Time Search Filter Logic
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                
                // Filter the array based on what the user types
                const filteredProgrammes = currentProgrammes.filter(prog => 
                    prog.toLowerCase().includes(searchTerm)
                );
                
                // Re-draw the screen with only the filtered items
                renderProgrammes(filteredProgrammes);
            });
        });
    </script>

</body>
</html>
