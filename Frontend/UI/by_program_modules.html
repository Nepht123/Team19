<!doctype html> 
<html lang="en"> 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Modules - Rate My Module</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Custom colors matching the Rate My Module brand */
        .text-navy { color: #00205b; }
        .bg-navy { background-color: #00205b; }
        
        /* Smooth animation for hovering over module rows */
        .module-card {
            transition: all 0.2s ease-in-out;
            border-left: 5px solid transparent;
        }
        
        /* Adds a gold accent line and subtle background lift when hovered */
        .module-card:hover {
            border-left: 5px solid #ffc107; 
            background-color: #f8f9fa;
            transform: translateY(-1px);
        }

        /* Styling for code tags inside cards */
        .module-code-badge {
            background-color: #e9ecef;
            color: #00205b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-navy d-flex align-items-center" href="home.html">
                <img src="UWC_LOGO.png" alt="UWC Logo" height="45" class="me-2">                  
                Rate My Module
            </a>
            
            <div class="ms-auto d-flex gap-2">
                <button onclick="history.back()" class="btn btn-outline-secondary rounded-pill fw-bold">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back
                </button>
                <a href="home.html" class="btn btn-outline-secondary rounded-pill fw-bold">
                    <i class="fa-solid fa-house me-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <header class="bg-navy text-white py-4 shadow-sm">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-md-6 mb-3 mb-md-0">
                    <h2 class="fw-bold mb-0" id="programTitle">Loading Program...</h2>
                    <p class="text-light mb-0" id="programSubtitle">Browse and filter modules below to view ratings and student insight.</p>
                </div>
                
                <div class="col-md-6">
                    <div class="input-group input-group-lg bg-white rounded-pill p-1 shadow-sm">
                        <span class="input-group-text border-0 bg-transparent text-muted">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-0 bg-transparent shadow-none" placeholder="Search by module name or code (e.g. CSC111)...">
                    </div>
                </div>
                
            </div>
        </div>
    </header>

    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-secondary mb-0">Curriculum Modules</h4>
                    <span class="badge bg-secondary rounded-pill px-3 py-2" id="resultCount">0 Results</span>
                </div>

                <div id="modulesList" class="d-flex flex-column gap-3"></div>
                
                <div id="noResultsMsg" class="text-center py-5 d-none">
                    <i class="fa-regular fa-face-frown-open fs-1 text-muted mb-3"></i>
                    <h5 class="text-muted">No modules match your search criteria.</h5>
                </div>
                
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Local Database storing sample modules mapped directly to program titles
            const programModulesData = {
                "BSc Computer Science": [
                    { code: "CSC111", name: "Introduction to Computer Science", year: "1st Year", credits: "15 Credits" },
                    { code: "MAT111", name: "Mathematics for Computer Science", year: "1st Year", credits: "15 Credits" },
                    { code: "CSC211", name: "Data Structures and Algorithms", year: "2nd Year", credits: "20 Credits" },
                    { code: "CSC212", name: "Database Systems", year: "2nd Year", credits: "20 Credits" },
                    { code: "CSC311", name: "Software Engineering", year: "3rd Year", credits: "24 Credits" },
                    { code: "CSC312", name: "Advanced Computer Networks", year: "3rd Year", credits: "24 Credits" }
                ],
                "BCom Accounting": [
                    { code: "ACC111", name: "Financial Accounting 1A", year: "1st Year", credits: "15 Credits" },
                    { code: "MAN121", name: "Introduction to Management", year: "1st Year", credits: "15 Credits" },
                    { code: "ACC211", name: "Management Accounting 2A", year: "2nd Year", credits: "20 Credits" },
                    { code: "TAX201", name: "Introduction to Taxation", year: "2nd Year", credits: "20 Credits" },
                    { code: "AUD301", name: "Auditing and Assurance", year: "3rd Year", credits: "24 Credits" }
                ],
                "LLB (Bachelor of Laws)": [
                    { code: "LAW111", name: "Introduction to Legal Studies", year: "1st Year", credits: "15 Credits" },
                    { code: "LAW122", name: "Law of Persons", year: "1st Year", credits: "15 Credits" },
                    { code: "LAW211", name: "Law of Contract", year: "2nd Year", credits: "20 Credits" },
                    { code: "LAW311", name: "Criminal Law", year: "3rd Year", credits: "24 Credits" },
                    { code: "LAW411", name: "Constitutional Law", year: "4th Year", credits: "24 Credits" }
                ],
                "BSc Nursing": [
                    { code: "NUR111", name: "Foundations of Professional Nursing", year: "1st Year", credits: "15 Credits" },
                    { code: "ANAT121", name: "Human Anatomy & Physiology", year: "1st Year", credits: "20 Credits" },
                    { code: "NUR211", name: "Clinical Nursing Practice", year: "2nd Year", credits: "24 Credits" },
                    { code: "NUR311", name: "General Nursing: Medical and Surgical", year: "3rd Year", credits: "30 Credits" }
                ],
                "BA Psychology": [
                    { code: "PSY111", name: "Introduction to Psychology", year: "1st Year", credits: "15 Credits" },
                    { code: "PSY211", name: "Developmental Psychology", year: "2nd Year", credits: "20 Credits" },
                    { code: "PSY311", name: "Research Methods in Psychology", year: "3rd Year", credits: "24 Credits" },
                    { code: "PSY312", name: "Psychopathology", year: "3rd Year", credits: "24 Credits" }
                ],
                "BChD (Dentistry)": [
                    { code: "DEN111", name: "Dental Anatomy and Morphology", year: "1st Year", credits: "15 Credits" },
                    { code: "DEN211", name: "Oral Biology and Histology", year: "2nd Year", credits: "20 Credits" },
                    { code: "DEN311", name: "Clinical Dentistry I", year: "3rd Year", credits: "30 Credits" }
                ],
                "BEd Senior Phase": [
                    { code: "EDN111", name: "Education Theory and Context 1", year: "1st Year", credits: "15 Credits" },
                    { code: "EDN211", name: "Classroom Management Logic", year: "2nd Year", credits: "20 Credits" },
                    { code: "EDN311", name: "Teaching Practice and Simulation", year: "3rd Year", credits: "24 Credits" }
                ]
            };

            // Generic Fallback list if someone selects an unmapped program card during prototyping
            const genericFallbackModules = [
                { code: "MOD101", name: "Core Discipline Foundation 1A", year: "1st Year", credits: "15 Credits" },
                { code: "MOD201", name: "Intermediate Academic Practice", year: "2nd Year", credits: "20 Credits" },
                { code: "MOD301", name: "Advanced Application Capstone", year: "3rd Year", credits: "24 Credits" }
            ];

            // 2. Extract program query parameter out of the incoming URL parameter string
            const urlParams = new URLSearchParams(window.location.search);
            const selectedProgramName = urlParams.get('program');

            // Find interactive interface target IDs
            const titleElement = document.getElementById('programTitle');
            const listContainer = document.getElementById('modulesList');
            const searchInput = document.getElementById('searchInput');
            const resultCount = document.getElementById('resultCount');
            const noResultsMsg = document.getElementById('noResultsMsg');

            let currentModules = [];

            // 3. Evaluate selection presence and route valid data structures to render
            if (selectedProgramName) {
                titleElement.textContent = selectedProgramName;
                
                // Route to custom curriculum arrays if key exists, otherwise provide general fallback mock items
                if (programModulesData[selectedProgramName]) {
                    currentModules = programModulesData[selectedProgramName];
                } else {
                    currentModules = genericFallbackModules;
                    document.getElementById('programSubtitle').textContent = "Displaying mock sample course framework modules.";
                }
                
                renderModules(currentModules);
            } else {
                // Completely empty or broken URL context redirection warning layout handles here
                titleElement.textContent = "All System Modules";
                document.getElementById('programSubtitle').textContent = "Please go back to navigate explicitly via structured program cards.";
                currentModules = Object.values(programModulesData).flat();
                renderModules(currentModules);
            }

            // 4. Component Layout Rendering Loop Engine
            function renderModules(modulesToRender) {
                listContainer.innerHTML = ''; 
                
                if (modulesToRender.length === 0) {
                    noResultsMsg.classList.remove('d-none');
                } else {
                    noResultsMsg.classList.add('d-none');
                    
                    modulesToRender.forEach(mod => {
                        const cardHTML = `
                            <div class="card shadow-sm border-0 module-card">
                                <div class="card-body p-4 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                                    <div class="d-flex align-items-center gap-3">
                                        <span class="badge module-code-badge px-3 py-2 rounded fs-6">${mod.code}</span>
                                        <div>
                                            <h5 class="fw-bold text-dark mb-1">${mod.name}</h5>
                                            <div class="d-flex gap-3 text-muted small">
                                                <span><i class="fa-solid fa-calendar-days me-1"></i>${mod.year}</span>
                                                <span><i class="fa-solid fa-bookmark me-1"></i>${mod.credits}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <a href="#" class="btn btn-navy text-white rounded-pill px-4 fw-bold shadow-sm">View Reviews</a>
                                    </div>
                                </div>
                            </div>
                        `;
                        listContainer.innerHTML += cardHTML;
                    });
                }
                
                resultCount.textContent = `${modulesToRender.length} Modules`;
            }

            // 5. Input Stream Multi-Key Target Filtering Event Interface
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                
                const filteredModules = currentModules.filter(mod => 
                    mod.name.toLowerCase().includes(searchTerm) || 
                    mod.code.toLowerCase().includes(searchTerm)
                );
                
                renderModules(filteredModules);
            });
        });
    </script>
</body>
</html>
